[project]
name = "deai"
version = "0.1.0"
description = "Detector red-teaming: train a rewriter against SlopTotal and study transfer across detector families"
requires-python = ">=3.12,<3.13"
dependencies = [
    # torch: install the CUDA 12.8 build first, see README
    "torch>=2.7",
    "transformers",
    "trl",
    "peft",
    "datasets",
    "sentence-transformers",
    "httpx",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["deai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
